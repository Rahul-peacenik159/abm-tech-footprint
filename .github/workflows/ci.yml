name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Validate packs
        run: python -m footprint packs
      - name: Compiled packs are up to date
        run: |
          python -m footprint compile-packs
          git diff --exit-code stack-packs/compiled || (echo "Run: python -m footprint compile-packs" && exit 1)
      - name: Tests
        run: python -m pytest -q
